<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>거래처 · 영업관리 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-kick">WONTECH FEED · CUSTOMERS</div>
      <div class="page-title"><i class="bi bi-building"></i>거래처</div>
    </div>
    <div class="page-sub" id="count-label"></div>
  </div>
  <p class="hint" style="margin:-10px 0 16px">판매일보 기준 자동 생성된 거래처 목록입니다 (누적 매출액 = 공급가액 기준). 담당자·연락처는 직접 입력해서 보완하세요. 행을 클릭하면 상세 실적과 거래 내역을 볼 수 있습니다.</p>

  <div class="wt-tools">
    <span class="pl" style="font-size:12px;font-weight:600;color:#374151">검색</span>
    <input id="search" placeholder="거래처명 또는 코드" style="width:240px" />
    <button id="search-btn" class="primary">검색</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="wt-tbl">
        <thead><tr><th class="rk"></th><th class="l">거래처명</th><th class="l">담당자</th><th class="l">연락처</th><th>거래건수</th><th>최근거래일</th><th>누적매출액</th></tr></thead>
        <tbody id="cust-body"><tr><td colspan="7" class="empty-state">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let ALL_SALES = [];
let keyword = "";

async function loadAll() {
  const [{ data: customers }, sales] = await Promise.all([
    sb.from("customers").select("*"),
    fetchAllRows((from, to) => sb.from("sales").select("customer_code,customer_name,sale_date,product_code,product_name,spec,qty,unit_price,supply_amount,total_amount").range(from, to)),
  ]);
  ALL_SALES = sales;
  return customers || [];
}

function renderTable(customers) {
  const body = document.getElementById("cust-body");
  const agg = {};
  for (const r of ALL_SALES) {
    const key = r.customer_code;
    if (!key) continue;
    if (!agg[key]) agg[key] = { count: 0, amount: 0, last: null };
    agg[key].count++;
    agg[key].amount += Number(r.supply_amount) || 0;
    const d = new Date(r.sale_date);
    if (!agg[key].last || d > agg[key].last) agg[key].last = d;
  }

  let rows = customers.map((c) => ({ ...c, ...(agg[c.code] || { count: 0, amount: 0, last: null }) }));
  if (keyword) {
    const kw = keyword.toLowerCase();
    rows = rows.filter((c) => (c.name || "").toLowerCase().includes(kw) || (c.code || "").toLowerCase().includes(kw));
  }
  rows.sort((a, b) => b.amount - a.amount);

  document.getElementById("count-label").textContent = `총 ${fmtNum(rows.length)}개 거래처`;

  body.innerHTML = rows.length
    ? rows.map((c, i) => `
      <tr class="clk" onclick="openDetail('${esc(c.code)}')">
        <td class="rk">${i + 1}</td>
        <td class="l nm">${esc(c.name)}</td>
        <td class="l">${c.manager ? esc(c.manager) : '<span class="mut">-</span>'}</td>
        <td class="l">${c.phone ? esc(c.phone) : '<span class="mut">-</span>'}</td>
        <td>${fmtNum(c.count)}</td>
        <td>${c.last ? c.last.toISOString().slice(0, 10) : "-"}</td>
        <td>${fmtWon(c.amount)}</td>
      </tr>`).join("")
    : '<tr><td colspan="7" class="empty-state">조건에 맞는 거래처가 없습니다.</td></tr>';
}

let CUSTOMERS = [];
let detailChart = null;

async function openDetail(code) {
  const { data: cust, error } = await sb.from("customers").select("*").eq("code", code).single();
  if (error || !cust) return;

  const txns = ALL_SALES.filter((r) => r.customer_code === code).sort((a, b) => new Date(b.sale_date) - new Date(a.sale_date));
  const totalAmount = txns.reduce((a, r) => a + (Number(r.supply_amount) || 0), 0);
  const last12Cut = new Date(); last12Cut.setMonth(last12Cut.getMonth() - 12);
  const recentAmount = txns.filter((r) => new Date(r.sale_date) >= last12Cut).reduce((a, r) => a + (Number(r.supply_amount) || 0), 0);

  const byMonth = {};
  for (const r of txns) {
    const m = r.sale_date.slice(0, 7);
    byMonth[m] = (byMonth[m] || 0) + (Number(r.supply_amount) || 0);
  }
  const months = Object.keys(byMonth).sort().slice(-12);

  const body = `
    <div class="tile-row">
      <div class="tile"><div class="l">누적 매출액</div><div class="v">${fmtWon(totalAmount)}</div></div>
      <div class="tile"><div class="l">거래 건수</div><div class="v">${fmtNum(txns.length)}건</div></div>
      <div class="tile"><div class="l">최근 12개월</div><div class="v">${fmtWon(recentAmount)}</div></div>
      <div class="tile"><div class="l">최근 거래일</div><div class="v" style="font-size:14px">${txns.length ? txns[0].sale_date : "-"}</div></div>
    </div>
    <div class="dsec">월별 매출 추이 (최근 12개월)</div>
    <div style="height:120px"><canvas id="cust-trend-chart"></canvas></div>

    <div class="dsec">담당자·연락처</div>
    <div class="wt-grid g-2">
      <div class="field"><label>담당자</label><input id="d-manager" value="${esc(cust.manager || "")}" /></div>
      <div class="field"><label>연락처</label><input id="d-phone" value="${esc(cust.phone || "")}" /></div>
      <div class="field"><label>이메일</label><input id="d-email" value="${esc(cust.email || "")}" /></div>
      <div class="field"><label>주소</label><input id="d-address" value="${esc(cust.address || "")}" /></div>
    </div>
    <div class="field" style="margin-top:10px"><label>메모</label><textarea id="d-memo" rows="2">${esc(cust.memo || "")}</textarea></div>
    <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
      <button class="primary" onclick="saveDetail('${esc(code)}')">저장</button><span class="hint" id="save-status" style="margin:0"></span>
    </div>

    <div class="dsec">최근 거래 내역 (최근 20건)</div>
    <div class="table-wrap"><table class="wt-tbl">
      <thead><tr><th class="l">일자</th><th class="l">품목</th><th class="l">규격</th><th>수량</th><th>공급가액</th></tr></thead>
      <tbody>${txns.slice(0, 20).map((t) => `<tr><td class="l">${t.sale_date}</td><td class="l">${esc(t.product_name || "-")}</td><td class="l">${esc(t.spec || "-")}</td><td>${fmtNum(t.qty)}</td><td>${fmtNum(t.supply_amount)}</td></tr>`).join("") || '<tr><td colspan="5" class="empty-state">거래 내역이 없습니다.</td></tr>'}</tbody>
    </table></div>
  `;
  openModal(`<i class="bi bi-building"></i> ${esc(cust.name)} <span style="font-size:12px;color:var(--mut);font-weight:500">${esc(cust.code)}</span>`, body, true);

  if (detailChart) detailChart.destroy();
  detailChart = new Chart(document.getElementById("cust-trend-chart"), {
    type: "bar",
    data: { labels: months.map((m) => m.slice(2)), datasets: [{ data: months.map((m) => byMonth[m]), backgroundColor: "#2563eb" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: (v) => fmtWon(v) } } } },
  });
}

async function saveDetail(code) {
  const payload = {
    manager: document.getElementById("d-manager").value.trim() || null,
    phone: document.getElementById("d-phone").value.trim() || null,
    email: document.getElementById("d-email").value.trim() || null,
    address: document.getElementById("d-address").value.trim() || null,
    memo: document.getElementById("d-memo").value.trim() || null,
    updated_at: new Date().toISOString(),
  };
  const statusEl = document.getElementById("save-status");
  statusEl.textContent = "저장 중...";
  const { error } = await sb.from("customers").update(payload).eq("code", code);
  statusEl.textContent = error ? `실패: ${error.message}` : "저장됨";
  if (!error) renderTable(CUSTOMERS);
}

document.getElementById("search-btn").addEventListener("click", () => {
  keyword = document.getElementById("search").value.trim();
  renderTable(CUSTOMERS);
});
document.getElementById("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("search-btn").click();
});

(async function () {
  const session = await requireAuth("customers");
  if (!session) return;
  CUSTOMERS = await loadAll();
  renderTable(CUSTOMERS);

  const code = new URLSearchParams(location.search).get("code");
  if (code) openDetail(code);
})();
</script>
</body>
</html>
