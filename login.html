<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 · 영업관리 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
</head>
<body>
  <div id="login-shell">
    <div class="lbox">
      <h1><i class="bi bi-bar-chart-line"></i> 영업관리 CRM</h1>
      <p class="sub">사료원료 영업 · 거래처/재고/판매 관리</p>
      <form id="login-form">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="primary" id="login-btn">로그인</button>
        <div class="auth-error" id="login-error"></div>
      </form>
    </div>
  </div>

<script>
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) location.replace("dashboard.html");
  });

  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "로그인 중...";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = "로그인";
    if (error) {
      errorEl.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인해주세요.";
      return;
    }
    location.replace("dashboard.html");
  });
</script>
</body>
</html>
