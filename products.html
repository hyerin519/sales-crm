<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>품목별 실적 · 영업관리 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-kick">WONTECH FEED · PRODUCT PERFORMANCE</div>
      <div class="page-title"><i class="bi bi-box-seam"></i>품목별 실적</div>
    </div>
    <div class="page-sub" id="count-label"></div>
  </div>

  <div class="wt-tools" id="period-host"></div>

  <div class="kpi-grid" id="kpi-strip"></div>

  <div class="wt-tools">
    <span class="pl">검색</span>
    <input id="search" placeholder="품목명 또는 코드" style="width:220px" />
    <button id="search-btn" class="primary">검색</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="wt-tbl">
        <thead><tr>
          <th class="rk"></th><th class="l">품목명</th><th class="l">규격</th>
          <th data-k="qty">출고수량</th><th data-k="avgPrice">평균단가</th><th data-k="sales">매출액</th><th data-k="yoy">전년比</th><th data-k="profit">매출총이익</th><th data-k="rate">이익률</th><th data-k="stock">현재재고</th>
        </tr></thead>
        <tbody id="prod-body"><tr><td colspan="10" class="empty-state">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let ALL_PROFIT = [];
let ALL_SALES = [];
let LATEST_INV_MAP = {};
let PERIOD = null;
let SORT_KEY = "sales";
let SORT_DIR = -1;
let keyword = "";

function toKey(dateStr) { const d = new Date(dateStr); return d.getFullYear() * 100 + (d.getMonth() + 1); }
function inPeriod(dateStr, p) { if (!dateStr) return false; const k = toKey(dateStr); return k >= p.sy * 100 + p.sm && k <= p.ey * 100 + p.em; }

function aggByProduct(rows) {
  const agg = {};
  for (const r of rows) {
    const key = r.product_code;
    if (!key) continue;
    if (!agg[key]) agg[key] = { code: key, name: r.product_name, spec: r.spec, qty: 0, sales: 0, profit: 0 };
    agg[key].qty += Number(r.qty) || 0;
    agg[key].sales += Number(r.sales_amount) || 0;
    agg[key].profit += Number(r.profit_amount) || 0;
  }
  return agg;
}

function computeRows() {
  const p = PERIOD.get();
  const prevP = { sy: p.sy - 1, sm: p.sm, ey: p.ey - 1, em: p.em };
  const rows = ALL_PROFIT.filter((r) => inPeriod(r.profit_date, p));
  const prevRows = ALL_PROFIT.filter((r) => inPeriod(r.profit_date, prevP));
  const agg = aggByProduct(rows);
  const prevAgg = aggByProduct(prevRows);

  let list = Object.values(agg).map((x) => {
    const prevSales = prevAgg[x.code] ? prevAgg[x.code].sales : 0;
    return { ...x, rate: x.sales ? (x.profit / x.sales) * 100 : 0, avgPrice: x.qty ? x.sales / x.qty : 0, stock: LATEST_INV_MAP[x.code] || 0, prevSales, yoy: prevSales ? (x.sales / prevSales - 1) * 100 : null };
  });
  if (keyword) {
    const kw = keyword.toLowerCase();
    list = list.filter((x) => (x.name || "").toLowerCase().includes(kw) || (x.code || "").toLowerCase().includes(kw));
  }
  list.sort((a, b) => {
    if (SORT_KEY === "yoy") return SORT_DIR * ((a.yoy === null ? -Infinity : a.yoy) - (b.yoy === null ? -Infinity : b.yoy));
    return SORT_DIR * ((a[SORT_KEY] || 0) - (b[SORT_KEY] || 0));
  });
  return list;
}

function render() {
  const list = computeRows();
  document.getElementById("count-label").textContent = `${list.length}개 품목`;

  const totalSales = list.reduce((a, x) => a + x.sales, 0);
  const totalProfit = list.reduce((a, x) => a + x.profit, 0);
  const totalStock = list.reduce((a, x) => a + x.stock, 0);
  const negCount = list.filter((x) => x.sales > 0 && x.rate < 0).length;
  document.getElementById("kpi-strip").innerHTML = `
    <div class="kpi-card"><div class="label">취급 품목 수</div><div class="value">${fmtNum(list.length)}</div></div>
    <div class="kpi-card"><div class="label">평균 이익률 (가중)</div><div class="value">${totalSales ? fmtPct(totalProfit / totalSales * 100) : "-"}</div></div>
    <div class="kpi-card"><div class="label">현재 재고 총수량</div><div class="value">${fmtNum(totalStock)}</div></div>
    <div class="kpi-card"><div class="label">적자 판매 품목</div><div class="value ${negCount ? "neg" : ""}">${fmtNum(negCount)}</div></div>
  `;

  document.getElementById("prod-body").innerHTML = list.length
    ? list.map((x, i) => `
      <tr class="clk" onclick="openDetail('${esc(x.code)}')">
        <td class="rk">${i + 1}</td>
        <td class="l nm">${esc(x.name)} <span class="mut" style="font-size:10.5px;font-weight:500">${esc(x.code)}</span></td>
        <td class="l tx2">${esc(x.spec || "-")}</td>
        <td>${fmtNum(x.qty)}</td>
        <td>${fmtNum(x.avgPrice)}</td>
        <td>${fmtNum(x.sales)}</td>
        <td>${x.yoy === null ? '<span class="mut">-</span>' : yoyBadge(x.yoy)}</td>
        <td>${fmtNum(x.profit)}</td>
        <td class="${x.rate < 0 ? "neg" : ""}" style="${x.rate < 0 ? "color:var(--red);font-weight:700" : ""}">${fmtPct(x.rate)}</td>
        <td>${fmtNum(x.stock)}</td>
      </tr>`).join("")
    : '<tr><td colspan="10" class="empty-state">조건에 맞는 품목이 없습니다.</td></tr>';
}

document.querySelectorAll("th[data-k]").forEach((th) => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (SORT_KEY === k) SORT_DIR *= -1; else { SORT_KEY = k; SORT_DIR = -1; }
    render();
  });
});
document.getElementById("search-btn").addEventListener("click", () => { keyword = document.getElementById("search").value.trim(); render(); });
document.getElementById("search").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("search-btn").click(); });

let detailChart = null;
async function openDetail(code) {
  const rows = ALL_PROFIT.filter((r) => r.product_code === code).sort((a, b) => new Date(a.profit_date) - new Date(b.profit_date));
  if (!rows.length) return;
  const name = rows[rows.length - 1].product_name, spec = rows[rows.length - 1].spec;
  const totalSales = rows.reduce((a, r) => a + (Number(r.sales_amount) || 0), 0);
  const totalProfit = rows.reduce((a, r) => a + (Number(r.profit_amount) || 0), 0);
  const rate = totalSales ? (totalProfit / totalSales) * 100 : 0;

  const byMonth = {};
  for (const r of rows) { const m = r.profit_date.slice(0, 7); byMonth[m] = (byMonth[m] || 0) + (Number(r.sales_amount) || 0); }
  const months = Object.keys(byMonth).sort().slice(-12);

  const salesRows = ALL_SALES.filter((r) => r.product_code === code);
  const byCust = {};
  for (const r of salesRows) {
    const key = r.customer_code;
    if (!key) continue;
    if (!byCust[key]) byCust[key] = { name: r.customer_name, v: 0, qty: 0, last: r.sale_date, lastPrice: r.unit_price };
    byCust[key].v += Number(r.supply_amount) || 0;
    byCust[key].qty += Number(r.qty) || 0;
    if (r.sale_date > byCust[key].last) { byCust[key].last = r.sale_date; byCust[key].lastPrice = r.unit_price; }
  }
  const topCust = Object.values(byCust).sort((a, b) => b.v - a.v).slice(0, 8);
  const mxCust = topCust.length ? topCust[0].v : 1;

  // 거래처별 판매단가 — 같은 품목을 거래처마다 얼마에 파는지 한눈에 비교
  const priceRows = Object.values(byCust).map((c) => ({ ...c, avgPrice: c.qty ? c.v / c.qty : 0 })).sort((a, b) => b.avgPrice - a.avgPrice);
  const priceVals = priceRows.map((c) => c.avgPrice).filter((v) => v > 0);
  const priceMax = priceVals.length ? Math.max(...priceVals) : 0;
  const priceMin = priceVals.length ? Math.min(...priceVals) : 0;
  const priceSpreadPct = priceMin > 0 ? ((priceMax - priceMin) / priceMin) * 100 : 0;

  const body = `
    <div class="tile-row">
      <div class="tile"><div class="l">누적 매출액</div><div class="v">${fmtWon(totalSales)}</div></div>
      <div class="tile"><div class="l">누적 매출총이익</div><div class="v">${fmtWon(totalProfit)}</div></div>
      <div class="tile"><div class="l">평균 이익률</div><div class="v">${fmtPct(rate)}</div></div>
      <div class="tile"><div class="l">현재 재고</div><div class="v">${fmtNum(LATEST_INV_MAP[code] || 0)}</div></div>
    </div>
    <div class="dsec">월별 매출 추이 (최근 12개월)</div>
    <div style="height:120px"><canvas id="prod-trend-chart"></canvas></div>
    <div class="dsec">거래처별 판매 TOP 8</div>
    ${topCust.length ? topCust.map((c) => `<div class="rank-item"><div class="rank-row"><span class="rn">${esc(c.name)}</span><span class="rv">${fmtWon(c.v)}</span></div><div class="rank-bar"><i style="width:${(c.v / mxCust * 100).toFixed(1)}%;background:#2563eb"></i></div></div>`).join("") : '<div class="empty-state">거래 내역이 없습니다.</div>'}

    <div class="dsec">거래처별 판매단가 비교 ${priceVals.length > 1 ? `<span style="color:${priceSpreadPct > 20 ? "var(--red)" : "var(--text-2)"};text-transform:none;font-weight:600">최고-최저 단가차 ${priceSpreadPct.toFixed(0)}%</span>` : ""}</div>
    <div class="table-wrap"><table class="wt-tbl">
      <thead><tr><th class="l">거래처</th><th>누적수량</th><th>평균단가</th><th>최근단가</th><th class="l">최근구매일</th></tr></thead>
      <tbody>${priceRows.map((c) => `<tr><td class="l nm">${esc(c.name)}</td><td>${fmtNum(c.qty)}</td><td style="${c.avgPrice === priceMax && priceMax !== priceMin ? "color:var(--red);font-weight:700" : c.avgPrice === priceMin && priceMax !== priceMin ? "color:var(--green);font-weight:700" : ""}">${fmtNum(c.avgPrice)}</td><td>${fmtNum(c.lastPrice)}</td><td class="l">${c.last}</td></tr>`).join("") || '<tr><td colspan="5" class="empty-state">거래 내역이 없습니다.</td></tr>'}</tbody>
    </table></div>
  `;
  openModal(`<i class="bi bi-box-seam"></i> ${esc(name)} <span style="font-size:12px;color:var(--mut);font-weight:500">${esc(code)} · ${esc(spec || "")}</span>`, body, true);

  if (detailChart) detailChart.destroy();
  detailChart = new Chart(document.getElementById("prod-trend-chart"), {
    type: "bar",
    data: { labels: months.map((m) => m.slice(2)), datasets: [{ data: months.map((m) => byMonth[m]), backgroundColor: "#2563eb" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: (v) => fmtWon(v) } } } },
  });
}

(async function () {
  const session = await requireAuth("products");
  if (!session) return;

  const [profitRows, salesRows, { data: latestSnap }] = await Promise.all([
    fetchAllRows((from, to) => sb.from("profit_daily").select("profit_date,product_code,product_name,spec,qty,sales_amount,profit_amount").range(from, to)),
    fetchAllRows((from, to) => sb.from("sales").select("customer_code,customer_name,product_code,qty,unit_price,supply_amount,sale_date").range(from, to)),
    sb.from("inventory_snapshots").select("snapshot_date").order("snapshot_date", { ascending: false }).limit(1),
  ]);
  ALL_PROFIT = profitRows;
  ALL_SALES = salesRows;

  if (!ALL_PROFIT.length) {
    document.getElementById("period-host").innerHTML = '<span class="mut">업로드된 데이터가 없습니다.</span>';
    document.getElementById("prod-body").innerHTML = '<tr><td colspan="8" class="empty-state">데이터가 없습니다.</td></tr>';
    return;
  }

  if (latestSnap && latestSnap.length) {
    const { data: inv } = await sb.from("inventory_snapshots").select("product_code,qty").eq("snapshot_date", latestSnap[0].snapshot_date);
    (inv || []).forEach((r) => { LATEST_INV_MAP[r.product_code] = (LATEST_INV_MAP[r.product_code] || 0) + (Number(r.qty) || 0); });
  }

  const latest = new Date(Math.max(...ALL_PROFIT.map((r) => new Date(r.profit_date).getTime())));
  const minYear = Math.min(...ALL_PROFIT.map((r) => new Date(r.profit_date).getFullYear()));
  PERIOD = createPeriodCtrl(document.getElementById("period-host"), {
    minYear, maxYear: latest.getFullYear(), maxMonth: latest.getMonth() + 1,
    onChange: render,
  });

  render();
  attachDatalist(document.getElementById("search"), [...new Set(ALL_PROFIT.map((r) => r.product_name).filter(Boolean))]);

  const code = new URLSearchParams(location.search).get("code");
  if (code) openDetail(code);
})();
</script>
</body>
</html>
