<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>매출이익현황 · 영업관리 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-kick">WONTECH FEED · PROFIT</div>
      <div class="page-title"><i class="bi bi-graph-up-arrow"></i>매출이익현황</div>
    </div>
    <div class="page-sub" id="count-label"></div>
  </div>

  <div class="wt-tools" id="period-host"></div>

  <div class="kpi-grid" id="kpi-strip"></div>

  <div class="panel">
    <div class="wt-st"><i class="bi bi-bar-chart"></i>월별 매출 / 매출총이익 (전년 비교)<span class="hint">막대=매출/매출총이익 · 점선=전년 동월 매출액 · 클릭 시 해당 월 상세</span></div>
    <div class="chart-wrap"><canvas id="monthly-chart"></canvas></div>
  </div>

  <div class="wt-tools">
    <div class="field"><label>품목명</label><input id="f-product" style="width:180px" /></div>
    <button id="search-btn" class="primary">조회</button>
    <button id="reset-btn">초기화</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="wt-tbl">
        <thead>
          <tr><th class="l">일자</th><th class="l">품목</th><th class="l">규격</th><th>출고수량</th><th>매출총액</th><th>매출원가</th><th>매출총이익</th><th>이익률</th></tr>
        </thead>
        <tbody id="profit-body"><tr><td colspan="8" class="empty-state">불러오는 중...</td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev-btn">이전</button>
      <span id="page-label">1 페이지</span>
      <button id="next-btn">다음</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 50;
let page = 0;
let PERIOD = null;
let monthlyChart = null;

function buildQuery() {
  let q = sb.from("profit_daily").select("*", { count: "exact" });
  const p = PERIOD.get();
  const { from, to } = periodToDates(p);
  q = q.gte("profit_date", from).lte("profit_date", to);
  const prod = document.getElementById("f-product").value.trim();
  if (prod) q = q.ilike("product_name", `%${prod}%`);
  return q.order("profit_date", { ascending: false }).order("id", { ascending: false });
}

async function loadTable() {
  const body = document.getElementById("profit-body");
  body.innerHTML = '<tr><td colspan="8" class="empty-state">불러오는 중...</td></tr>';

  const { data, count, error } = await buildQuery().range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
  if (error) { body.innerHTML = `<tr><td colspan="8" class="empty-state">오류: ${error.message}</td></tr>`; return; }
  if (!data || !data.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty-state">데이터가 없습니다.</td></tr>';
    document.getElementById("count-label").textContent = "";
    return;
  }

  document.getElementById("count-label").textContent = `총 ${fmtNum(count)}건`;
  document.getElementById("page-label").textContent = `${page + 1} / ${Math.max(1, Math.ceil(count / PAGE_SIZE))} 페이지`;

  body.innerHTML = data.map((r) => `
    <tr>
      <td class="l">${r.profit_date}</td>
      <td class="l">${esc(r.product_name || "-")}</td>
      <td class="l">${esc(r.spec || "-")}</td>
      <td>${fmtNum(r.qty)}</td>
      <td>${fmtNum(r.sales_amount)}</td>
      <td>${fmtNum(r.cost_amount)}</td>
      <td>${fmtNum(r.profit_amount)}</td>
      <td class="${Number(r.profit_rate) < 0 ? "mut" : ""}">${fmtPct(r.profit_rate)}</td>
    </tr>`).join("");
}

async function loadMonthlyChart() {
  const p = PERIOD.get();
  const prevP = { sy: p.sy - 1, sm: p.sm, ey: p.ey - 1, em: p.em };
  const { from, to } = periodToDates(p);
  const prevDates = periodToDates(prevP);
  const [{ data }, { data: prevData }] = await Promise.all([
    sb.from("profit_daily").select("profit_date, sales_amount, profit_amount").gte("profit_date", from).lte("profit_date", to),
    sb.from("profit_daily").select("profit_date, sales_amount").gte("profit_date", prevDates.from).lte("profit_date", prevDates.to),
  ]);

  const months = [];
  for (let y = p.sy, m = p.sm; y < p.ey || (y === p.ey && m <= p.em); m++) {
    if (m > 12) { m = 1; y++; }
    months.push(`${y}-${String(m).padStart(2, "0")}`);
  }
  const byMonth = {};
  for (const r of data || []) {
    const m = r.profit_date.slice(0, 7);
    if (!byMonth[m]) byMonth[m] = { sales: 0, profit: 0 };
    byMonth[m].sales += Number(r.sales_amount) || 0;
    byMonth[m].profit += Number(r.profit_amount) || 0;
  }
  const byMonthPrev = {};
  for (const r of prevData || []) {
    const m = r.profit_date.slice(0, 7);
    byMonthPrev[m] = (byMonthPrev[m] || 0) + (Number(r.sales_amount) || 0);
  }
  const sales = months.map((m) => (byMonth[m] ? byMonth[m].sales : 0));
  const profit = months.map((m) => (byMonth[m] ? byMonth[m].profit : 0));
  const prevYearSales = months.map((m) => { const [y, mm] = m.split("-").map(Number); const key = `${y - 1}-${String(mm).padStart(2, "0")}`; return byMonthPrev[key] || 0; });

  const totalSales = sales.reduce((a, v) => a + v, 0), totalProfit = profit.reduce((a, v) => a + v, 0);
  const totalPrevSales = prevYearSales.reduce((a, v) => a + v, 0);
  const yoy = totalPrevSales ? (totalSales / totalPrevSales - 1) * 100 : null;
  document.getElementById("kpi-strip").innerHTML = `
    <div class="kpi-card"><div class="label">매출액 (선택 기간)</div><div class="value">${fmtWon(totalSales)}</div></div>
    <div class="kpi-card"><div class="label">매출총이익</div><div class="value">${fmtWon(totalProfit)}</div></div>
    <div class="kpi-card"><div class="label">이익률</div><div class="value">${totalSales ? fmtPct(totalProfit / totalSales * 100) : "-"}</div></div>
    <div class="kpi-card"><div class="label">전년동기 대비</div><div class="value ${yoy === null ? "" : yoy >= 0 ? "pos" : "neg"}">${yoy === null ? "-" : (yoy >= 0 ? "▲" : "▼") + Math.abs(yoy).toFixed(1) + "%"}</div></div>
  `;

  if (monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(document.getElementById("monthly-chart"), {
    type: "bar",
    data: { labels: months.map((m) => m.slice(2)), datasets: [
      { label: "매출액", data: sales, backgroundColor: "#2563eb", order: 2 },
      { label: "매출총이익", data: profit, backgroundColor: "#15803d", order: 2 },
      { label: "전년 동월 매출액", data: prevYearSales, type: "line", borderColor: "#94a3b8", borderDash: [5, 4], backgroundColor: "transparent", order: 1, pointRadius: 0, borderWidth: 1.5 },
    ]},
    options: {
      maintainAspectRatio: false,
      scales: { y: { ticks: { callback: (v) => fmtWon(v) } } },
      onClick: (evt, els) => { if (els.length) openMonthModal(months[els[0].index]); },
    },
  });
}

async function openMonthModal(monthStr) {
  const { data } = await sb.from("profit_daily").select("*").gte("profit_date", monthStr + "-01").lt("profit_date", monthStr + "-32");
  const rows = (data || []).filter((r) => r.profit_date.slice(0, 7) === monthStr);
  const agg = {};
  for (const r of rows) {
    const key = r.product_code;
    if (!agg[key]) agg[key] = { name: r.product_name, spec: r.spec, sales: 0, profit: 0 };
    agg[key].sales += Number(r.sales_amount) || 0;
    agg[key].profit += Number(r.profit_amount) || 0;
  }
  const list = Object.entries(agg).map(([code, v]) => ({ code, ...v })).sort((a, b) => b.sales - a.sales);
  const rowsHtml = list.map((x, i) => {
    const rate = x.sales ? (x.profit / x.sales) * 100 : 0;
    return `<tr class="clk" onclick="location.href='products.html?code=${encodeURIComponent(x.code)}'"><td class="rk">${i + 1}</td><td class="l">${esc(x.name)}</td><td class="l tx2">${esc(x.spec || "-")}</td><td>${fmtNum(x.sales)}</td><td>${fmtNum(x.profit)}</td><td>${fmtPct(rate)}</td></tr>`;
  }).join("");
  openModal(`<i class="bi bi-calendar-check"></i> ${monthStr} 품목별 매출이익`,
    `<div class="table-wrap"><table class="wt-tbl"><thead><tr><th></th><th class="l">품목</th><th class="l">규격</th><th>매출액</th><th>매출총이익</th><th>이익률</th></tr></thead><tbody>${rowsHtml || '<tr><td colspan="6" class="empty-state">데이터가 없습니다.</td></tr>'}</tbody></table></div>`, true);
}

document.getElementById("search-btn").addEventListener("click", () => { page = 0; loadTable(); });
document.getElementById("reset-btn").addEventListener("click", () => {
  document.getElementById("f-product").value = "";
  page = 0;
  loadTable();
});
document.getElementById("prev-btn").addEventListener("click", () => { if (page > 0) { page--; loadTable(); } });
document.getElementById("next-btn").addEventListener("click", () => { page++; loadTable(); });

(async function () {
  const session = await requireAuth("profit");
  if (!session) return;

  const { data: latestRows } = await sb.from("profit_daily").select("profit_date").order("profit_date", { ascending: false }).limit(1);
  const { data: earliestRows } = await sb.from("profit_daily").select("profit_date").order("profit_date", { ascending: true }).limit(1);
  if (!latestRows || !latestRows.length) {
    document.getElementById("period-host").innerHTML = '<span class="mut">업로드된 데이터가 없습니다.</span>';
    document.getElementById("profit-body").innerHTML = '<tr><td colspan="8" class="empty-state">데이터가 없습니다.</td></tr>';
    return;
  }
  const latest = new Date(latestRows[0].profit_date);
  const earliest = new Date(earliestRows[0].profit_date);

  PERIOD = createPeriodCtrl(document.getElementById("period-host"), {
    minYear: earliest.getFullYear(), maxYear: latest.getFullYear(), maxMonth: latest.getMonth() + 1,
    onChange: () => { page = 0; loadTable(); loadMonthlyChart(); },
  });

  loadTable();
  loadMonthlyChart();
})();
</script>
</body>
</html>
