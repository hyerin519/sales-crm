<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>매출이익현황 · 영업관리 CRM</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
</head>
<body>
<div class="page">
  <h1 class="page-title">매출이익현황</h1>
  <p class="page-sub">최근 12개월 매출/매출총이익 추이와 일자·품목별 상세 내역입니다.</p>

  <div class="panel">
    <div style="font-weight:700; margin-bottom:10px;">월별 매출 / 매출총이익 (최근 12개월)</div>
    <div class="chart-wrap"><canvas id="monthly-chart"></canvas></div>
  </div>

  <div class="form-row">
    <div class="field"><label>시작일</label><input id="f-start" type="date" /></div>
    <div class="field"><label>종료일</label><input id="f-end" type="date" /></div>
    <div class="field"><label>품목명</label><input id="f-product" style="width:180px" /></div>
    <button id="search-btn" class="primary">조회</button>
    <button id="reset-btn">초기화</button>
    <span class="hint" id="count-label"></span>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>일자</th><th>품목</th><th>규격</th><th class="num">출고수량</th><th class="num">매출총액</th><th class="num">매출원가</th><th class="num">매출총이익</th><th class="num">이익률</th></tr>
        </thead>
        <tbody id="profit-body"><tr><td colspan="8" class="empty-state">불러오는 중...</td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev-btn">이전</button>
      <span id="page-label">1 페이지</span>
      <button id="next-btn">다음</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 50;
let page = 0;

function buildQuery() {
  let q = sb.from("profit_daily").select("*", { count: "exact" });
  const start = document.getElementById("f-start").value;
  const end = document.getElementById("f-end").value;
  const prod = document.getElementById("f-product").value.trim();
  if (start) q = q.gte("profit_date", start);
  if (end) q = q.lte("profit_date", end);
  if (prod) q = q.ilike("product_name", `%${prod}%`);
  return q.order("profit_date", { ascending: false }).order("id", { ascending: false });
}

async function loadTable() {
  const body = document.getElementById("profit-body");
  body.innerHTML = '<tr><td colspan="8" class="empty-state">불러오는 중...</td></tr>';

  const { data, count, error } = await buildQuery().range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
  if (error) {
    body.innerHTML = `<tr><td colspan="8" class="empty-state">오류: ${error.message}</td></tr>`;
    return;
  }
  if (!data || !data.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty-state">데이터가 없습니다.</td></tr>';
    document.getElementById("count-label").textContent = "";
    return;
  }

  document.getElementById("count-label").textContent = `총 ${fmtNum(count)}건`;
  document.getElementById("page-label").textContent = `${page + 1} / ${Math.max(1, Math.ceil(count / PAGE_SIZE))} 페이지`;

  body.innerHTML = data.map((r) => `
    <tr>
      <td>${r.profit_date}</td>
      <td>${r.product_name || "-"}</td>
      <td>${r.spec || "-"}</td>
      <td class="num">${fmtNum(r.qty)}</td>
      <td class="num">${fmtNum(r.sales_amount)}</td>
      <td class="num">${fmtNum(r.cost_amount)}</td>
      <td class="num">${fmtNum(r.profit_amount)}</td>
      <td class="num">${fmtPct(r.profit_rate)}</td>
    </tr>
  `).join("");
}

async function loadMonthlyChart() {
  const { data: latestRows } = await sb.from("profit_daily").select("profit_date").order("profit_date", { ascending: false }).limit(1);
  if (!latestRows || !latestRows.length) return;
  const latest = new Date(latestRows[0].profit_date);
  const rangeStart = new Date(latest.getFullYear(), latest.getMonth() - 11, 1);
  const toISO = (d) => d.toISOString().slice(0, 10);

  const { data } = await sb
    .from("profit_daily")
    .select("profit_date, sales_amount, profit_amount")
    .gte("profit_date", toISO(rangeStart));

  const byMonth = {};
  for (const r of data || []) {
    const m = r.profit_date.slice(0, 7);
    if (!byMonth[m]) byMonth[m] = { sales: 0, profit: 0 };
    byMonth[m].sales += Number(r.sales_amount) || 0;
    byMonth[m].profit += Number(r.profit_amount) || 0;
  }

  const labels = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(rangeStart.getFullYear(), rangeStart.getMonth() + i, 1);
    labels.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  const sales = labels.map((m) => (byMonth[m] ? byMonth[m].sales : 0));
  const profit = labels.map((m) => (byMonth[m] ? byMonth[m].profit : 0));

  new Chart(document.getElementById("monthly-chart"), {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "매출액", data: sales, backgroundColor: "#2f6feb" },
        { label: "매출총이익", data: profit, backgroundColor: "#1f9d55" },
      ],
    },
    options: {
      maintainAspectRatio: false,
      scales: { y: { ticks: { callback: (v) => fmtNum(v) } } },
    },
  });
}

document.getElementById("search-btn").addEventListener("click", () => { page = 0; loadTable(); });
document.getElementById("reset-btn").addEventListener("click", () => {
  document.getElementById("f-start").value = "";
  document.getElementById("f-end").value = "";
  document.getElementById("f-product").value = "";
  page = 0;
  loadTable();
});
document.getElementById("prev-btn").addEventListener("click", () => { if (page > 0) { page--; loadTable(); } });
document.getElementById("next-btn").addEventListener("click", () => { page++; loadTable(); });

(async function () {
  const session = await requireAuth("profit");
  if (!session) return;
  loadTable();
  loadMonthlyChart();
})();
</script>
</body>
</html>
